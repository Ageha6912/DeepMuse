<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">DeepMuse — 属于你自己的 AI 聊天空间</title>
  <desc id="heroDesc">DeepMuse 是一个蓝白液态风格的个人 AI 聊天网页。左侧为品牌弯月水纹标识与名称，右侧为简化的应用界面示意，展示侧栏、对话气泡与输入框。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111C33"/>
      <stop offset="1" stop-color="#16264A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#534AB7"/>
      <stop offset="1" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#534AB7"/>
      <stop offset="1" stop-color="#6D66D4"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="30" cy="25" r="13" fill="#fff"/>
      <circle cx="37" cy="20" r="12" fill="#000"/>
    </mask>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="25.5" fill="none" stroke="#2B4066" stroke-opacity="0.7"/>

  <!-- 左侧：品牌与价值 -->
  <g transform="translate(64 38)">
    <!-- 品牌标记：弯月 + 水纹 + 星点 -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="64" height="64" rx="18" fill="#534AB7"/>
      <rect x="5" y="5" width="54" height="54" rx="14" fill="#7F77DD"/>
      <g transform="translate(0 0)">
        <rect width="64" height="64" fill="#fff" mask="url(#crescent)"/>
        <path d="M17 42Q32 49 47 42" fill="none" stroke="#fff" stroke-opacity="0.95" stroke-width="3" stroke-linecap="round"/>
        <path d="M21 48Q32 53 43 48" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M26 54Q32 57 38 54" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
        <path d="M46 10L47.6 14.4L52 16L47.6 17.6L46 22L44.4 17.6L40 16L44.4 14.4Z" fill="#fff"/>
      </g>
    </g>

    <text x="86" y="29" fill="#9FB3D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">PERSONAL AI CHAT SPACE</text>

    <text x="0" y="150" fill="#F5F8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="76" font-weight="700" letter-spacing="-2">DeepMuse</text>

    <text x="2" y="200" fill="#D7E4F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27">属于你自己的 AI 聊天空间</text>
    <text x="2" y="240" fill="#9FB3D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21">蓝白液态界面 · 图片与文档附件 · 语音 · 搜索引用 · 深浅双主题</text>

    <g transform="translate(2 280)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#534AB7" fill-opacity="0.28" stroke="#7F77DD" stroke-opacity="0.55"/>
      <text x="75" y="22" text-anchor="middle" fill="#C9D6F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">SELF-HOSTED</text>
      <rect x="162" y="0" width="118" height="34" rx="17" fill="#534AB7" fill-opacity="0.28" stroke="#7F77DD" stroke-opacity="0.55"/>
      <text x="221" y="22" text-anchor="middle" fill="#C9D6F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">MIT LICENSE</text>
    </g>
  </g>

  <!-- 分隔 -->
  <line x1="628" y1="64" x2="628" y2="296" stroke="#2B4066" stroke-opacity="0.8"/>

  <!-- 右侧：应用界面示意（取自真实产品的结构） -->
  <g transform="translate(668 56)">
    <!-- 窗口 -->
    <rect x="0" y="0" width="468" height="248" rx="18" fill="#0E1830" stroke="#334870"/>
    <rect x="0.5" y="0.5" width="467" height="247" rx="17.5" fill="none" stroke="#4A63A0" stroke-opacity="0.5"/>

    <!-- 顶栏 -->
    <line x1="0" y1="40" x2="468" y2="40" stroke="#2B4066"/>
    <circle cx="20" cy="20" r="4" fill="#7F77DD" fill-opacity="0.8"/>
    <circle cx="34" cy="20" r="4" fill="#7F77DD" fill-opacity="0.5"/>
    <circle cx="48" cy="20" r="4" fill="#7F77DD" fill-opacity="0.3"/>
    <rect x="150" y="12" width="168" height="16" rx="8" fill="#1B2B4C"/>
    <text x="234" y="24" text-anchor="middle" fill="#8FA8D6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">chat.ageha.cn</text>

    <!-- 侧栏 -->
    <rect x="0" y="40" width="112" height="208" fill="#101E38"/>
    <line x1="112" y1="40" x2="112" y2="248" stroke="#2B4066"/>
    <rect x="12" y="52" width="88" height="24" rx="8" fill="url(#accent)"/>
    <text x="56" y="68" text-anchor="middle" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="600">＋ 新对话</text>
    <rect x="12" y="88" width="88" height="9" rx="4.5" fill="#223556"/>
    <rect x="12" y="106" width="72" height="9" rx="4.5" fill="#223556"/>
    <rect x="12" y="124" width="80" height="9" rx="4.5" fill="#223556"/>
    <rect x="12" y="142" width="60" height="9" rx="4.5" fill="#223556"/>
    <circle cx="24" cy="235" r="6" fill="#2E4574"/>
    <rect x="36" y="231" width="56" height="8" rx="4" fill="#2E4574"/>

    <!-- 主对话区 -->
    <g transform="translate(136 60)">
      <!-- 用户气泡 -->
      <rect x="128" y="0" width="204" height="40" rx="12" fill="url(#bubble)"/>
      <rect x="140" y="12" width="180" height="6" rx="3" fill="#E8ECFF" fill-opacity="0.9"/>
      <rect x="140" y="24" width="120" height="6" rx="3" fill="#E8ECFF" fill-opacity="0.65"/>
      <!-- 助手回复 -->
      <circle cx="6" cy="72" r="7" fill="#534AB7"/>
      <path d="M3 72q3 -4 6 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="22" y="62" width="250" height="8" rx="4" fill="#3A517E"/>
      <rect x="22" y="78" width="286" height="8" rx="4" fill="#31466E"/>
      <rect x="22" y="94" width="214" height="8" rx="4" fill="#31466E"/>
      <!-- 附件卡片 -->
      <rect x="22" y="116" width="150" height="34" rx="9" fill="#16274A" stroke="#3A517E"/>
      <rect x="30" y="124" width="18" height="18" rx="5" fill="#534AB7"/>
      <rect x="56" y="127" width="90" height="6" rx="3" fill="#5A74A8"/>
      <rect x="56" y="138" width="60" height="5" rx="2.5" fill="#40598A"/>
      <!-- 输入框 -->
      <rect x="2" y="166" width="320" height="34" rx="12" fill="#16274A" stroke="#3A517E"/>
      <rect x="14" y="179" width="150" height="7" rx="3.5" fill="#3A517E"/>
      <circle cx="304" cy="183" r="11" fill="url(#accent)"/>
      <path d="M300 183l3 3 5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

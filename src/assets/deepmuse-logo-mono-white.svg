<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-labelledby="title desc">
  <title id="title">DeepMuse 反白单色标准标识</title>
  <desc id="desc">反白单色标识与 DeepMuse 标准字组合，纯白、透明背景，适用于深色背景。</desc>
  <defs>
    <mask id="dm-logo-mono-white-crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="30" cy="25" r="13" fill="#fff"/>
      <circle cx="37" cy="20" r="12" fill="#000"/>
    </mask>
    <symbol id="dm-logo-mono-white-mark" viewBox="0 0 64 64">
      <rect width="64" height="64" fill="#FFFFFF" mask="url(#dm-logo-mono-white-crescent)"/>
      <path d="M17 42Q32 49 47 42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M21 48Q32 53 43 48" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M26 54Q32 57 38 54" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M46 10L47.6 14.4L52 16L47.6 17.6L46 22L44.4 17.6L40 16L44.4 14.4Z" fill="#FFFFFF"/>
    </symbol>
  </defs>
  <use href="#dm-logo-mono-white-mark" x="12" y="22" width="96" height="96"/>
  <text x="132" y="72" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="600" letter-spacing="-1.5">DeepMuse</text>
  <text x="134" y="104" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" letter-spacing="5">沉思 · 灵感之深</text>
  <text x="135" y="126" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="2.4">DEEP THOUGHT, QUIET MUSE</text>
</svg>

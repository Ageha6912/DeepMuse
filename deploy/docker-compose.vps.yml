name: deepmuse

services:
  deepmuse:
    image: deepmuse:latest
    container_name: deepmuse
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - cloud

networks:
  cloud:
    external: true
    # 改为你的反向代理容器所在 Docker 网络名
    name: proxy_network
